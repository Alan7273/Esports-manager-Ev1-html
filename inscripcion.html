<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSport Arena Manager - Inscripcion</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <span class="logo">eSport Arena Manager</span>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="torneos.html">Torneo</a></li>
                <li><a href="torneo-detalle.html?id=t1">Torneo detalle</a></li>
                <li><a href="inscripcion.html" aria-current="page">Inscripcion</a></li>
                <li><a href="equipo.html">mi equipo</a></li>
                <li><a href="perfil.html">mi perfil </a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h1>Inscripcion a torneo</h1>
            <form id="form-inscripcion" novalidate>
                <div class="field">
                    <label for="tipo-participante">tipo-participante</label>
                    <select id="tipo-participante" name="tipo-participante">
                        <option value="equipo">equipo</option>
                    </select>
                </div>

                <div class="field">
                    <label for="torneo">torneo</label>
                    <select id="torneo" name="torneo" required></select>
                    <span class="mensaje" id="error-torneo" role="alert"></span>
                </div>
                <div class="field">
                    <label for="equipo">equipo</label>
                    <select id="equipo" name="equipo" required></select>
                    <span class="mensaje" id="error-equipo" role="alert"></span>
                </div>

                <p id="resumen"></p>

                <button type="submit">confirmar inscripcion</button>
                <p id ="confirmacion" role="status"></p>
            </form>
        </section>
    </main>

    <script> src="js/data.js"</script>
    <script> src="js/app.js"</script>
</body>
</html>
