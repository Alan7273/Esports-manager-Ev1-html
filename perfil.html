<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSport Arena Manager - Inscripcion</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
    <span class="logo">eSport Arena Manager</span>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="torneos.html">Torneo</a></li>
            <li><a href="torneo-detalle.html?id=t1">Torneo detalle</a></li>
            <li><a href="inscripcion.html" aria-current="page">Inscripcion</a></li>
            <li><a href="equipo.html">mi equipo</a></li>
            <li><a href="perfil.html">mi perfil </a></li>
        </ul>
    </nav>
</header>
<main>
    <section>
        <h1>jugador</h1>
        <div id="perfil de datos"></div>
    </section>
    <section>
        <h1>equipos</h1>
        <div id="perfil de equipos"></div>
    </section>
    <section>
        <h1>estadisticas</h1>
        <div id="perfil de estadisticas"></div>
    </section>
    <section>
        <h1>sanciones</h1>
        <div id="perfil de sanciones"></div>
    </section>
    <section>
        <h2>editar datos</h2>
        <form id="perfil" novalidate>
            <div class="field">
                <label for="apodo">apodo</label>
                <input type="text" id="apodo" autocomplete="username" required>
                <span class="error" id="error apodo" role="alert"></span>
            </div>
            <div class="field">
                <label for="correo">correo</label>
                <input type="email" id="correo" autocomplete="correo" required>
                <span class="error" id="error correo" role="alert"></span>
            </div>
            <div class="field">
                <label for="edad">edad</label>
                <input type="number" id="edad" min="13" max="99" autocomplete="of" required>
                <span class="error" id="error edad" role="alert"></span>
            </div>
            <div class="field">
                <label for="nueva contraseña">nueva contraseña</label>
                <input type="password" id="nueva contraseña" autocomplete="nueva contraseña" required>
                <span class="error" id="error contraseña" role="alert"></span>
            </div>
            <div class="field">
                <label for="confirmar contraseña">confirmar contraseña</label>
                <input type="password" id="confirmar contraseña" autocomplete="nueva contraseña" required>
                <span class="error" id="error nueva contraseña" role="alert"></span>
            </div>
            <button type="submit">guardar cambios</button>
            <p id="confirmar" role="status"></p>
        </form>
    </section>
</main>
<script> src="js/data.js"</script>
<script> src="js/app.js"</script>
</body>
</html>
