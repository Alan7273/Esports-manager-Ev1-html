<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSport Arena Manager - Mi perfil</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
    <span class="logo">eSport Arena Manager</span>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="torneos.html">Torneos</a></li>
            <li><a href="torneo-detalle.html?id=t1">Torneo detalle</a></li>
            <li><a href="inscripcion.html" aria-current="page">Inscripcion</a></li>
            <li><a href="equipo.html">mi equipo</a></li>
            <li><a href="perfil.html">mi perfil </a></li>
        </ul>
    </nav>
</header>

<main>
    <section>
        <h1>Perfil de jugador</h1>
        <div id="perfil-datos"></div>
    </section>

    <section>
        <h2>Equipos</h2>
        <ul id="perfil-equipos"></ul>
    </section>

    <section>
        <h2>Estadisticas</h2>
        <p id="perfil-estadisticas"></p>
    </section>

    <section>
        <h2>Sanciones</h2>
        <ul id="perfil-sanciones"></ul>
    </section>

    <section>
        <h2>editar datos</h2>
        <form id="form-perfil" novalidate>
            <div class="field">
                <label for="perfil-apodo">Apodo</label>
                <input type="text" id="perfil-apodo" autocomplete="username" required>
                <span class="error-msg" id="error-apodo" role="alert"></span>
            </div>
            <div class="field">
                <label for="perfil-email">Correo</label>
                <input type="email" id="perfil-email" autocomplete="email" required>
                <span class="error-msg" id="error-email" role="alert"></span>
            </div>
            <div class="field">
                <label for="perfil-edad">Edad</label>
                <input type="number" id="perfil-edad" min="13" max="99" autocomplete="off" required>
                <span class="error-msg" id="error-edad" role="alert"></span>
            </div>
            <div class="field">
                <label for="perfil-password">Nueva contraseña</label>
                <input type="password" id="perfil-password" autocomplete="new-password" required>
                <span class="error-msg" id="error-password" role="alert"></span>
            </div>
            <div class="field">
                <label for="perfil-password2">Confirmar contraseña</label>
                <input type="password" id="perfil-password2" autocomplete="new-password" required>
                <span class="error-msg" id="error-password2" role="alert"></span>
            </div>
            <button type="submit">Guardar cambios</button>
            <p id="perfil-confirmacion" role="status"></p>
        </form>
    </section>
</main>

<footer>
    <p>&copy; eSports Arena Manager - Proyecto Semestral - 2026-2</p>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
